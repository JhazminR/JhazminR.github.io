<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Términa Central Bank - Sistema de Monitoreo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=IM+Fell+English:ital@0;1&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep:   #0a0612;
            --bg-purple: #1a0d2e;
            --gold:      #d4af37;
            --gold-soft: #f0d87a;
            --teal:      #00ffcc;
            --crimson:   #b3001b;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            color: #fff;
            overflow-x: hidden;
        }

        html {
            background: #000;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 60px;
            text-align: center;
            background:
                radial-gradient(ellipse at 50% 20%,
                    var(--bg-purple) 0%,
                    var(--bg-deep) 55%,
                    #000 100%);
            background-attachment: fixed;
            font-family: 'IM Fell English', 'Courier Prime', serif;
            position: relative;
        }

        /* ================== VIÑETA + GRANO ================== */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 40;
            background:
                radial-gradient(ellipse at center,
                    transparent 42%,
                    rgba(0, 0, 0, .55) 88%,
                    rgba(0, 0, 0, .88) 100%);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 39;
            opacity: .05;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence baseFrequency='.9'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        }

        /* ================== DÍA FINAL (30 sep antes de 18) ================== */
        body.final-day {
            animation: moonShudder 7s ease-in-out infinite;
        }
        @keyframes moonShudder {
            0%, 46%, 54%, 100% { transform: translate(0, 0); }
            47%   { transform: translate(-1.5px, 1px); }
            48%   { transform: translate(1.5px, -1px); }
            49%   { transform: translate(-1px, -1px); }
            50%   { transform: translate(1px, 1px); }
            51%   { transform: translate(0, 0); }
        }

        body.final-day::after {
            background:
                radial-gradient(circle at 50% 12%,
                    rgba(179, 0, 27, .30) 0%,
                    rgba(179, 0, 27, .08) 18%,
                    transparent 34%),
                radial-gradient(ellipse at center,
                    transparent 42%,
                    rgba(0, 0, 0, .55) 88%,
                    rgba(0, 0, 0, .9) 100%);
        }

        /* ================== PARTÍCULAS ================== */
        #mm-particles {
            position: fixed;
            inset: 0;
            z-index: 30;
            pointer-events: none;
            opacity: .55;
        }

        /* ================== RELOJ 3 DÍAS ================== */
        #mm-clock {
            position: fixed;
            top: 14px;
            right: 14px;
            width: 82px;
            height: 82px;
            z-index: 50;
            pointer-events: none;
            filter: drop-shadow(0 0 12px rgba(212, 175, 55, .55));
            opacity: .92;
        }
        #mm-clock svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }
        .mm-clock-label {
            position: absolute;
            bottom: -22px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: .62rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--gold);
            text-shadow: 0 0 8px rgba(212, 175, 55, .6);
        }

        /* ================== CONTENIDO ================== */
        #content-container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            position: relative;
            z-index: 20;
        }

        .hidden {
            display: none !important;
        }

        /* ================== TEXTOS ================== */
        .game-text {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: clamp(1.3rem, 5.6vw, 2.2rem);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 18px;
            line-height: 1.25;
            color: var(--gold-soft);
            text-shadow:
                0 0 8px rgba(212, 175, 55, .75),
                0 0 24px rgba(212, 175, 55, .35),
                0 2px 0 #000;
            animation: fadeIn 1.8s ease-in-out;
        }

        .sub-text {
            font-family: 'IM Fell English', serif;
            font-size: clamp(.95rem, 3.7vw, 1.16rem);
            color: #c9bfa8;
            max-width: 600px;
            margin: 0 auto 22px;
            line-height: 1.75;
            animation: fadeIn 2.6s ease-in-out;

            /* Caja de diálogo ornamentada */
            background: rgba(26, 13, 46, .78);
            border: 2px solid var(--gold);
            border-radius: 4px;
            padding: 24px 26px;
            box-shadow:
                inset 0 0 22px rgba(212, 175, 55, .10),
                0 0 0 4px rgba(10, 6, 18, .9),
                0 0 0 5px rgba(212, 175, 55, .35),
                0 0 30px rgba(212, 175, 55, .15);
            position: relative;
            text-align: left;
        }

        .sub-text::before,
        .sub-text::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--gold);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--gold);
        }
        .sub-text::before { top: -5px; left: -5px; }
        .sub-text::after  { top: -5px; right: -5px; }

        .highlight-green {
            color: var(--teal);
            text-shadow: 0 0 10px rgba(0, 255, 204, .5);
        }

        .highlight-red {
            color: var(--crimson);
            font-weight: bold;
            text-shadow:
                0 0 12px rgba(179, 0, 27, .95),
                0 0 30px rgba(179, 0, 27, .4);
            animation: pulseRed 1.7s ease-in-out infinite;
        }
        @keyframes pulseRed {
            0%, 100% { opacity: 1; }
            50%      { opacity: .7; }
        }

        .highlight-gold {
            color: var(--gold);
            text-shadow: 0 0 10px rgba(212, 175, 55, .55);
        }

        .time-box {
            display: inline-block;
            border: 1px solid rgba(212, 175, 55, .3);
            padding: 12px 22px;
            background: rgba(10, 6, 18, .8);
            border-radius: 4px;
            font-family: 'Courier Prime', monospace;
            font-size: .72rem;
            color: #7a6a52;
            margin-top: 26px;
            letter-spacing: 1px;
        }

        .final-box {
            text-align: left;
            max-width: 520px;
            margin: 0 auto;
            padding: 24px 26px;
            border: 2px solid var(--gold);
            border-radius: 4px;
            background: rgba(26, 13, 46, .8);
            font-family: 'IM Fell English', serif;
            font-size: clamp(.9rem, 3.6vw, 1.08rem);
            line-height: 1.85;
            animation: fadeIn 2.5s ease-in-out;
            box-shadow:
                inset 0 0 24px rgba(0, 255, 204, .08),
                0 0 0 4px rgba(10, 6, 18, .9),
                0 0 0 5px rgba(0, 255, 204, .35),
                0 0 30px rgba(0, 255, 204, .15);
            position: relative;
        }
        .final-box::before,
        .final-box::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--teal);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--teal);
        }
        .final-box::before { bottom: -5px; left: -5px; }
        .final-box::after  { bottom: -5px; right: -5px; }

        /* ================== BOTÓN CONECTAR ================== */
        .btn-conectar {
            display: inline-block;
            margin: 6px auto 0;
            padding: 15px 32px;
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: clamp(.85rem, 3.4vw, 1rem);
            letter-spacing: 3px;
            color: #150c00;
            background: linear-gradient(180deg, #f0d87a 0%, #d4af37 55%, #a5811f 100%);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            animation: pulseBtn 2.2s ease-in-out infinite;
            touch-action: manipulation;
            text-shadow: 0 1px 0 rgba(255, 255, 255, .3);
        }

        .btn-conectar:active {
            transform: scale(.96);
        }

        @keyframes pulseBtn {
            0%, 100% {
                box-shadow:
                    0 0 14px rgba(212, 175, 55, .55),
                    inset 0 0 6px rgba(255, 255, 255, .25);
            }
            50% {
                box-shadow:
                    0 0 38px rgba(240, 216, 122, .95),
                    inset 0 0 10px rgba(255, 255, 255, .4);
            }
        }

        /* ================== OCARINA ================== */
        .ocarina-container {
            margin: 30px auto 0;
            text-align: center;
        }

        .ocarina-wrap {
            display: inline-block;
            animation: float 4.5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-9px); }
        }

        .ocarina-img {
            display: block;
            width: min(46vw, 200px);
            height: auto;
            cursor: pointer;
            user-select: none;
            -webkit-user-drag: none;
            filter: drop-shadow(0 0 18px rgba(0, 255, 204, .45))
                    drop-shadow(0 0 4px rgba(212, 175, 55, .5));
            transition: width .6s cubic-bezier(.2, .8, .2, 1), filter .35s ease;
            margin: 0 auto;
        }

        #interfaz-ocarina.compact .ocarina-img {
            width: min(30vw, 130px);
        }

        .ocarina-img.playing {
            animation: strum .42s cubic-bezier(.36, .07, .19, .97);
            filter: drop-shadow(0 0 38px rgba(0, 255, 204, .95))
                    drop-shadow(0 0 12px rgba(212, 175, 55, .9));
        }

        @keyframes strum {
            0%   { transform: rotate(0deg)   scale(1); }
            18%  { transform: rotate(-8deg)  scale(1.10); }
            45%  { transform: rotate(7deg)   scale(1.06); }
            72%  { transform: rotate(-3deg)  scale(1.02); }
            100% { transform: rotate(0deg)   scale(1); }
        }

        .instruccion-ocarina {
            margin: 0 0 14px;
            font-family: 'Cinzel', serif;
            font-weight: 600;
            font-size: clamp(.74rem, 3.1vw, .88rem);
            letter-spacing: 4px;
            color: var(--teal);
            animation: blink 2.2s ease-in-out infinite;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 255, 204, .6);
        }

        #interfaz-ocarina.compact .instruccion-ocarina {
            animation: none;
            color: var(--gold);
            text-shadow: 0 0 12px rgba(212, 175, 55, .7);
        }

        @keyframes blink {
            0%, 100% { opacity: .38; }
            50%      { opacity: 1; }
        }

        /* ================== PAD DE NOTAS ================== */
        .pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
            width: min(76vw, 270px);
            aspect-ratio: 1 / 1;
            margin: 24px auto 0;
            animation: fadeIn .55s ease;
        }

        #btn-up    { grid-column: 2; grid-row: 1; }
        #btn-left  { grid-column: 1; grid-row: 2; }
        #btn-a     { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down  { grid-column: 2; grid-row: 3; }

        .nota-btn {
            width: 100%;
            height: 100%;
            padding: 0;
            border-radius: 50%;
            font-family: 'Cinzel', serif;
            font-weight: 900;
            line-height: 1;
            font-size: clamp(.95rem, 3.8vw, 1.25rem);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            transition: transform .08s ease, box-shadow .15s ease,
                        background .15s ease, color .15s ease;
            position: relative;
            overflow: hidden;
        }

        /* Textura tipo piedra/oro grabado */
        .nota-btn::after {
            content: '';
            position: absolute;
            inset: 4px;
            border-radius: 50%;
            border: 1px dashed rgba(0, 0, 0, .25);
            pointer-events: none;
        }

        .btn-c {
            border: 2px solid rgba(212, 175, 55, .85);
            color: var(--gold-soft);
            background:
                radial-gradient(circle at 32% 28%, rgba(255, 236, 168, .28), transparent 55%),
                radial-gradient(circle at 68% 72%, rgba(0, 0, 0, .85), rgba(20, 12, 4, .98));
            box-shadow:
                0 0 12px rgba(212, 175, 55, .25),
                inset 0 2px 3px rgba(255, 236, 168, .2),
                inset 0 -3px 5px rgba(0, 0, 0, .8);
            text-shadow: 0 0 8px rgba(240, 216, 122, .8);
        }

        .btn-a {
            border: 2px solid rgba(0, 255, 204, .9);
            color: var(--teal);
            font-size: clamp(1.15rem, 4.6vw, 1.55rem);
            background:
                radial-gradient(circle at 32% 28%, rgba(180, 255, 240, .3), transparent 55%),
                radial-gradient(circle at 68% 72%, rgba(0, 40, 35, .95), rgba(0, 10, 8, .98));
            box-shadow:
                0 0 18px rgba(0, 255, 204, .35),
                inset 0 2px 4px rgba(180, 255, 240, .25),
                inset 0 -3px 6px rgba(0, 0, 0, .85);
            text-shadow: 0 0 10px rgba(0, 255, 204, .9);
        }

        .nota-btn.active {
            transform: scale(.85);
        }

        .btn-c.active {
            background: radial-gradient(circle at 35% 30%, #fff4c2, #f0d87a 55%, #d4af37 100%);
            color: #221a00;
            box-shadow:
                0 0 36px rgba(240, 216, 122, 1),
                inset 0 0 12px rgba(255, 255, 255, .6);
            text-shadow: none;
        }

        .btn-a.active {
            background: radial-gradient(circle at 35% 30%, #c8fff2, #00ffcc 55%, #00b894 100%);
            color: #00201a;
            box-shadow:
                0 0 38px rgba(0, 255, 204, 1),
                inset 0 0 12px rgba(255, 255, 255, .6);
            text-shadow: none;
        }

        /* ================== SECUENCIA ================== */
        .secuencia-display {
            margin-top: 22px;
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: clamp(1rem, 4.2vw, 1.4rem);
            letter-spacing: 8px;
            color: var(--gold-soft);
            text-shadow:
                0 0 12px rgba(240, 216, 122, .9),
                0 0 26px rgba(240, 216, 122, .4);
            min-height: 34px;
            animation: fadeIn .5s ease;
        }

        .seq-hint {
            margin-top: 10px;
            font-family: 'Cinzel', serif;
            font-size: clamp(.78rem, 3.4vw, .92rem);
            letter-spacing: 6px;
            color: #6b5e3e;
            animation: fadeIn .5s ease;
        }

        /* ================== ÉXITO ================== */
        .mensaje-exito {
            margin: 28px auto 0;
            max-width: 540px;
            padding: 24px 26px;
            background:
                radial-gradient(ellipse at top, rgba(0, 255, 51, .08), transparent 60%),
                rgba(13, 43, 18, .82);
            border: 2px solid #00ff33;
            color: #00ff33;
            border-radius: 6px;
            font-family: 'IM Fell English', serif;
            font-weight: bold;
            font-size: clamp(.9rem, 3.6vw, 1.04rem);
            line-height: 1.65;
            box-shadow:
                0 0 22px rgba(0, 255, 51, .35),
                inset 0 0 24px rgba(0, 255, 51, .1);
            position: relative;
            animation: timeFreeze 1.2s cubic-bezier(.2, .9, .2, 1) both;
        }

        .mensaje-exito::before,
        .mensaje-exito::after {
            content: '';
            position: absolute;
            width: 9px;
            height: 9px;
            background: #00ff33;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff33;
        }
        .mensaje-exito::before { top: -5px; left: -5px; }
        .mensaje-exito::after  { top: -5px; right: -5px; }

        @keyframes timeFreeze {
            from { filter: blur(8px); opacity: 0; transform: scale(1.05); }
            to   { filter: blur(0);   opacity: 1; transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-height: 720px) {
            .pad { width: min(64vw, 230px); }
            .ocarina-img { width: min(34vw, 150px); }
            #interfaz-ocarina.compact .ocarina-img { width: min(24vw, 105px); }
            #mm-clock { width: 66px; height: 66px; }
        }

        @media (max-width: 520px) {
            #mm-clock { width: 64px; height: 64px; top: 10px; right: 10px; }
            .mm-clock-label { font-size: .55rem; }
            body { padding: 20px 12px 50px; }
        }
    </style>
</head>

<body>

    <!-- ================= RELOJ 3 DÍAS ================= -->
    <div id="mm-clock" aria-hidden="true">
        <svg viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="56" fill="#0a0612" stroke="#d4af37" stroke-width="2"/>
            <circle cx="60" cy="60" r="46" fill="none" stroke="#d4af37" stroke-width="1" opacity=".45"/>
            <!-- Marcas 3 días -->
            <line x1="60" y1="8"   x2="60" y2="18" stroke="#d4af37" stroke-width="2"/>
            <line x1="105" y1="60" x2="95" y2="60" stroke="#d4af37" stroke-width="2"/>
            <line x1="15"  y1="60" x2="25" y2="60" stroke="#d4af37" stroke-width="2"/>
            <!-- Punto central -->
            <circle cx="60" cy="60" r="2.5" fill="#d4af37" opacity=".7"/>
            <!-- Sol (día) -->
            <circle id="mm-sun" cx="60" cy="14" r="6" fill="#f0d87a" filter="url(#mm-glow)"/>
            <!-- Luna (noche) -->
            <circle id="mm-moon" cx="60" cy="106" r="6" fill="#b3001b"/>
            <defs>
                <filter id="mm-glow">
                    <feGaussianBlur stdDeviation="2" result="b"/>
                    <feMerge>
                        <feMergeNode in="b"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>
        </svg>
        <div class="mm-clock-label">DAY <span id="mm-day">1</span></div>
    </div>

    <!-- ================= PARTÍCULAS ================= -->
    <canvas id="mm-particles" aria-hidden="true"></canvas>

    <!-- ================= CONTENIDO ================= -->
    <div id="content-container"></div>

    <script>
        (function () {
            'use strict';

            /* ==========================================================
               ARCHIVOS DE AUDIO
               Deben estar en la MISMA carpeta que este index.html
               ========================================================== */
            const AUDIO = {
                dia1: 'dia1.mp3',
                dia2: 'dia2.mp3',
                dia2Lento: 'dia2_ralentizado.mp3',
                dia3: 'dia3.mp3',
                astral: 'cancion_astral.mp3',
                insideMoon: 'cancion_inside.mp3',
                endCredits: 'cancion_end.mp3',
                odaAlOrden: 'cancion_odaalorden.mp3',
                curacion: 'cancion_curacion.mp3',
                curacionCompleta: 'cancion_curacion_completa.mp3',
                cancionTiempo: 'cancion_tiempo.mp3',
                notaA: 'nota_a.mp3',
                notaAbajo: 'nota_abajo.mp3',
                notaDerecha: 'nota_derecha.mp3',
                notaArriba: 'nota_arriba.mp3',
                notaIzquierda: 'nota_izquierda.mp3'
            };

            const SYMBOL = { A: 'A', CDOWN: '▼', CRIGHT: '►', CUP: '▲', CLEFT: '◀' };

            /* ==========================================================
               CONFIGURACIONES DE OCARINA
               ========================================================== */
            const OCARINA_CONFIGS = {
                // Canción del Tiempo invertida (▼ A ► ▼ A ►)
                songOfTimeInverted: {
                    sequence: ['CDOWN', 'A', 'CRIGHT', 'CDOWN', 'A', 'CRIGHT'],
                    instruction: 'TOCA LA CANCIÓN DEL TIEMPO INVERTIDA',
                    hint: '♪ ▼ A ► ▼ A ► ♪',
                    resultMusic: 'cancionTiempo',
                    afterMusic: 'dia2Lento',
                    resultText: '✔ ¡CÓDIGO DE CONTROL ACEPTADO!<br><br>' +
                        'El flujo temporal se ha ralentizado a la mitad. ' +
                        'Margen de maniobra amoroso extendido. Inflación contenida ' +
                        'hasta la apertura del miércoles.'
                },
                // Oda al Orden (► ▼ A ▼ ► ▲)
                oathToOrder: {
                    sequence: ['CRIGHT', 'CDOWN', 'A', 'CDOWN', 'CRIGHT', 'CUP'],
                    instruction: 'TOCA LA ODA AL ORDEN',
                    hint: '♪ ► ▼ A ▼ ► ▲ ♪',
                    resultMusic: 'odaAlOrden',
                    afterMusic: 'insideMoon',
                    resultText: '✔ ¡ODA AL ORDEN EJECUTADA!<br><br>' +
                        'Los cuatro gigantes han sido invocados. La luna ' +
                        'comienza a alejarse... algo brilla en el interior ' +
                        'del satélite.'
                },
                // Canción de Curación (◄ ► ▼ ◄ ► ▼)
                songOfHealing: {
                    sequence: ['CLEFT', 'CRIGHT', 'CDOWN', 'CLEFT', 'CRIGHT', 'CDOWN'],
                    instruction: 'TOCA LA CANCIÓN DE CURACIÓN',
                    hint: '♪ ◄ ► ▼ ◄ ► ▼ ♪',
                    resultMusic: 'curacion',
                    afterMusic: 'curacionCompleta',
                    resultText: '✔ ¡CANCIÓN DE CURACIÓN COMPLETADA!<br><br>' +
                        'Las heridas del sistema han sido restauradas. ' +
                        'El núcleo late con nueva energía. Todo vuelve a ' +
                        'estar en orden.'
                }
            };

            /* ==========================================================
               CACHÉ Y HELPERS DE AUDIO
               ========================================================== */
            const audioCache = {};
            let currentBgAudio = null;

            function getAudio(key) {
                if (audioCache[key]) return audioCache[key];
                const src = AUDIO[key];
                if (!src) return null;
                const a = new Audio(src);
                a.preload = 'auto';
                audioCache[key] = a;
                return a;
            }

            function fadeAudio(a, target, ms, cb) {
                if (!a) { if (cb) cb(); return; }
                const start = a.volume;
                const t0 = performance.now();
                function step(t) {
                    const p = Math.min(1, (t - t0) / ms);
                    a.volume = Math.max(0, Math.min(1, start + (target - start) * p));
                    if (p < 1) requestAnimationFrame(step);
                    else if (cb) cb();
                }
                requestAnimationFrame(step);
            }

            function playWithFade(a, targetVol, fadeMs, loop) {
                if (!a) return;
                a.loop = !!loop;
                try { a.currentTime = 0; } catch (e) { }
                a.volume = 0;
                const p = a.play();
                if (p && p.then) {
                    p.then(function () { fadeAudio(a, targetVol, fadeMs); })
                        .catch(function () { });
                } else {
                    fadeAudio(a, targetVol, fadeMs);
                }
            }

            function stopBg() {
                if (!currentBgAudio) return;
                const a = currentBgAudio;
                currentBgAudio = null;
                fadeAudio(a, 0, 600, function () {
                    try { a.pause(); a.currentTime = 0; } catch (e) { }
                });
            }

            function playBg(key, vol, loop) {
                stopBg();
                const a = getAudio(key);
                if (!a) return;
                currentBgAudio = a;
                playWithFade(a, vol != null ? vol : 0.5, 1200, loop !== false);
            }

            function playNoteSound(key) {

                    A: 'notaA',
                    CDOWN: 'notaAbajo',
                    CRIGHT: 'notaDerecha',

                    CLEFT: 'notaIzquierda'

                try { a.pause(); a.currentTime = 0; } catch (e) { }

                const interfaz = document.getElementById('interfaz-ocarina');

            function handleOcarinaPress(key) {
                if (!ocarinaState || ocarinaState.completed) return;
                const cfg = ocarinaState.config;

                playNoteSound(key);

                const now = performance.now();
                if (now - ocarinaState.lastNoteTime > 2500) ocarinaState.progress = [];
                ocarinaState.lastNoteTime = now;

                const visor = document.getElementById('visor-secuencia');
                const expected = cfg.sequence[ocarinaState.progress.length];

                if (key === expected) {
                    ocarinaState.progress.push(key);
                    if (visor) {
                        visor.textContent = ocarinaState.progress
                            .map(function (k) { return SYMBOL[k]; })
                            .join(' ');
                    }
                    if (ocarinaState.progress.length === cfg.sequence.length) {
                        completeOcarina();
                    }
                } else {
                    ocarinaState.progress = (key === cfg.sequence[0]) ? [key] : [];
                    if (visor) {
                        visor.textContent = ocarinaState.progress
                            .map(function (k) { return SYMBOL[k]; })
                            .join(' ') || '✗';
                    }
                    ocarinaState.failCount++;
                    if (ocarinaState.failCount >= 2) {
                        const hint = document.getElementById('hint-sequence');
                        if (hint) {
                            hint.textContent = cfg.hint;
                            hint.classList.remove('hidden');
                        }
                    }
                }
            }

            function completeOcarina() {
                ocarinaState.completed = true;
                const cfg = ocarinaState.config;

                document.getElementById('botones-ocarina').classList.add('hidden');
                document.getElementById('visor-secuencia').classList.add('hidden');
                const hint = document.getElementById('hint-sequence');
                if (hint) hint.classList.add('hidden');
                const instr = document.getElementById('instruccion-ocarina');
                if (instr) instr.classList.add('hidden');
                const img = document.getElementById('img-ocarina');
                if (img) img.classList.add('hidden');

                const mensaje = document.getElementById('mensaje-exito');
                if (mensaje) {
                    mensaje.innerHTML = cfg.resultText;
                    mensaje.classList.remove('hidden');
                }

                const result = getAudio(cfg.resultMusic);
                if (result) {
                    result.loop = false;
                    result.volume = 0;
                    try { result.currentTime = 0; } catch (e) { }
                    const p = result.play();
                    if (p && p.then) {
                        p.then(function () { fadeAudio(result, 0.8, 800); })
                            .catch(function () { fallbackAfter(cfg); });
                    } else {
                        fadeAudio(result, 0.8, 800);
                    }
                    result.onended = function () {
                        if (cfg.afterMusic) {
                            const after = getAudio(cfg.afterMusic);
                            if (after) playWithFade(after, 0.55, 1200, true);
                        }
                    };
                } else {
                    fallbackAfter(cfg);
                }
            }

                if (cfg.afterMusic) {

            function updateClock(day, month) {
                // Día 1 = 28 sep, Día 2 = 29 sep, Día 3 = 30 sep (y siguientes)
                let dayIndex = 1;
                if (month === 9) dayIndex = Math.max(1, Math.min(3, day - 27));
                else if(month === 10) dayIndex = day;
                else dayIndex = 3;

                const dayEl = document.getElementById('mm-day');
                if (dayEl) dayEl.textContent = dayIndex;

                // Ángulo según la hora real (0h arriba, 12h abajo)
                const hour = new Date().getHours();
                const angle = ((hour / 24) * 360 - 90) * Math.PI / 180;
                const cx = 60, cy = 60, r = 46;
                const sun = document.getElementById('mm-sun');
                const moon = document.getElementById('mm-moon');
                if (sun) {
                    sun.setAttribute('cx', cx + r * Math.cos(angle));
                    sun.setAttribute('cy', cy + r * Math.sin(angle));
                }
                if (moon) {
                    moon.setAttribute('cx', cx - r * Math.cos(angle));
                    moon.setAttribute('cy', cy - r * Math.sin(angle));
                }
            }

            /* ==========================================================
               PARTÍCULAS
               ========================================================== */
            function startParticles() {
                const c = document.getElementById('mm-particles');
                if (!c) return;
                const ctx = c.getContext('2d');
                let W, H, parts = [];

                function resize() {
                    W = c.width = window.innerWidth;
                    H = c.height = window.innerHeight;
                }
                window.addEventListener('resize', resize);
                resize();

                const COLORS = ['#d4af37', '#f0d87a', '#8a6df0', '#b3001b'];
                for (let i = 0; i < 45; i++) {
                    parts.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        r: Math.random() * 1.6 + .4,
                        vy: -(Math.random() * .35 + .1),
                        vx: (Math.random() - .5) * .25,
                        c: COLORS[(Math.random() * COLORS.length) | 0],
                        a: Math.random() * .5 + .2
                    });
                }

                function tick() {
                    ctx.clearRect(0, 0, W, H);
                    for (let i = 0; i < parts.length; i++) {
                        const p = parts[i];
                        p.x += p.vx;
                        p.y += p.vy;
                        if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
                        if (p.x < -10) p.x = W + 10;
                        if (p.x > W + 10) p.x = -10;
                        ctx.globalAlpha = p.a;
                        ctx.fillStyle = p.c;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                    requestAnimationFrame(tick);
                }
                tick();
            }

            function boot() {
                const container = document.getElementById('content-container');
                container.innerHTML = buildTimeline();
                setupDay();
                startParticles();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', boot);
            } else {
                boot();
            }

        })();
    </script>
</body>

</html>
